baseURL = "https://go-liquid.github.io/"
languageCode = "en-us"
title = "go-liquid"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 7.27:1, bright on the dark background 7.96:1.
  base = "#155e75"
  deep = "#0d3947"
  bright = "#06b6d4"
  shadow = "rgba(21,94,117,.7)"
  glow = "rgba(21,94,117,.6)"
  wash = "rgba(21,94,117,.10)"
  washDeep = "rgba(13,57,71,.06)"
  chipBg = "#e1f6fa"
  chipBorder = "#b4e9f2"
  chipFg = "#0d3947"
  chipBgDark = "rgba(6,182,212,.14)"
  chipBorderDark = "rgba(6,182,212,.32)"
  chipFgDark = "#76d7e7"
  statsEnd = "#c3edf5"
  bandText = "#d7f3f8"
  accent = "#155e75"
  accentDark = "#06b6d4"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://go-liquid.github.io/docs/"
  label = "Documentation"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-liquid"
  label = "GitHub"
